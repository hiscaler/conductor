name: Build Conductor Desktop

on:
  push:
    branches: [main]
    # 仅程序源码变更时构建。不要把 build/**、Conductor.exe 列入 paths，
    # 否则 bot 回写产物会再次触发，形成循环。
    paths:
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "wails.json"
      - "internal/**"
      - "assets/**"
      - "frontend/**"
      - "scripts/gen-icon.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate app icons from logo
        run: |
          npm install
          npm run gen-icon

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build desktop exe
        run: wails build

      - name: Copy exe to repository root
        shell: pwsh
        run: |
          Copy-Item -Force "build/bin/Conductor.exe" "Conductor.exe"
          Get-Item "Conductor.exe" | Format-List FullName, Length, LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Conductor
          path: Conductor.exe

      - name: Commit Conductor.exe to root
        shell: pwsh
        run: |
          git config user.name "bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Conductor.exe
          if (git diff --staged --quiet) {
            Write-Host "No changes to commit"
            exit 0
          }
          git commit -m "Chg: 更新 Conductor.exe"
          git push
